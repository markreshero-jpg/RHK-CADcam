<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Vanity Curved End</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF1EF; --panel:#FAFBF9; --ink:#1B252C; --muted:#5A6870; --rule:#CBD3D1; --accent:#E0762B;
  --scene:#E6EAE8; --wrap:#B98A5E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#10161A; --panel:#151D22; --ink:#DCE4E7; --muted:#8B9AA2; --rule:#2B373E; --accent:#EB8A45; --scene:#182127; --wrap:#C99A6E;}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#10161A; --panel:#151D22; --ink:#DCE4E7; --muted:#8B9AA2; --rule:#2B373E; --accent:#EB8A45; --scene:#182127; --wrap:#C99A6E;}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;font-size:15px}
.app{height:100%;display:grid;grid-template-columns:1fr 300px}
#view{position:relative;min-height:0;background:var(--scene);touch-action:none}
#view canvas{display:block;width:100%;height:100%;outline:none}
.hint{position:absolute;left:16px;bottom:14px;font:12px "IBM Plex Mono",monospace;color:var(--muted);pointer-events:none}
.side{background:var(--panel);border-left:1.5px solid var(--ink);padding:18px 18px 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px;line-height:1.1;font-weight:700;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
h2{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 13px "IBM Plex Sans Condensed",sans-serif;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:6px 10px;cursor:pointer}
button:hover{background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{font:13px "IBM Plex Mono",monospace;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:0}
#plan{width:100%;max-height:280px;display:block}
#flat{width:100%;height:auto;display:block;margin-top:10px}
#flat text{font:10px "IBM Plex Mono",monospace;fill:var(--muted)}
#plan text{font:10px "IBM Plex Mono",monospace;fill:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.params{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.params label{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:0;cursor:default;font-size:12.5px;color:var(--muted)}
.params input{font:14px "IBM Plex Mono",monospace;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:5px 7px;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.params input:focus,.params select:focus{border-color:var(--accent)}
.params label.chk{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;color:var(--ink);font-size:14px;cursor:pointer}
.params label.chk input{width:16px;height:16px;padding:0;flex:none}
.params .fld{display:flex;flex-direction:column;gap:3px}
.params input:disabled{opacity:.5}
.params select{font:13px "IBM Plex Sans Condensed",sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:5px 4px;width:100%;box-sizing:border-box}
.warn{margin:0;padding:8px 10px;border-left:3px solid #C0392B;background:color-mix(in srgb,#C0392B 10%,transparent);font-size:13px;line-height:1.35}
.warn:empty{display:none}
.params input[type=text]{font:14px "IBM Plex Mono",monospace}
#bZip{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#bZip:hover{background:var(--ink);border-color:var(--ink)}
#bZip[disabled],#bPdf[disabled],#bJobSave[disabled]{opacity:.5;cursor:default}
.filebtn{font:500 13px "IBM Plex Sans Condensed",sans-serif;color:var(--ink);border:1px solid var(--ink);padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center}
.filebtn:hover{background:var(--ink);color:var(--panel)}
#fJob:focus-visible+*,.filebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .side{border-left:0;border-top:1.5px solid var(--ink)}
}
</style>

<div class="app">
  <div id="view"><div class="hint">drag to spin · scroll or pinch to zoom · right-drag to pan</div></div>
  <aside class="side">
    <div>
      <h1>Vanity Curved End</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div>
      <h2>Sizes (mm)</h2>
      <div class="params">
        <label>Width<input id="pW" type="number" inputmode="decimal" min="40" step="1" value="170"></label>
        <label>Depth<input id="pD" type="number" inputmode="decimal" min="100" step="1" value="500"></label>
        <label>Height<input id="pH" type="number" inputmode="decimal" min="100" step="1" value="500"></label>
        <label>Radius<input id="pR" type="number" inputmode="decimal" min="20" step="1" value="150"></label>
        <label>Face board<input id="pFT" type="number" inputmode="decimal" min="6" step="0.5" value="18"></label>
        <label>Skin<input id="pSK" type="number" inputmode="decimal" min="0.5" step="0.5" value="2"></label>
        <label>Carcass<input id="pT" type="number" inputmode="decimal" min="6" step="0.5" value="16.5"></label>
        <label>Hand<select id="pHand"><option value="RH">Right hand</option><option value="LH">Left hand</option><option value="DOUBLE">Both ends curved</option></select></label>
        <label>Back overhang L<input id="pOL" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label>Back overhang R<input id="pOR" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label>Gable overhang<input id="pOG" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label>Back scribe<input id="pSBK" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label>Bottom scribe<input id="pSBT" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label>Top scribe<input id="pSTP" type="number" inputmode="decimal" min="0" step="5" value="0"></label>
        <label class="chk" style="grid-column:1/-1"><input id="pBlkS" type="checkbox"> Fixing block on flat side</label>
        <label class="chk" style="grid-column:1/-1"><input id="pBlkF" type="checkbox"> Fixing block on flat front</label>
        <label class="chk" style="grid-column:1/-1"><input id="pLight" type="checkbox"> Cut out rib centres</label>
        <label>Rib border<input id="pB" type="number" inputmode="decimal" min="20" step="5" value="60"></label>
        <div class="fld"><label class="chk" style="font-size:12.5px;color:var(--muted)"><input id="pOnion" type="checkbox"> Onion skin</label><input id="pOS" type="number" inputmode="decimal" min="0.1" step="0.1" value="0.3" disabled aria-label="Onion skin thickness"></div>
        <label>&nbsp;<button id="bReset" type="button">Reset sizes</button></label>
      </div>
      <p class="warn" id="warn" style="margin-top:10px"></p>
    </div>
    <div>
      <h2>Export for S2M</h2>
      <div class="params">
        <label style="grid-column:1/-1">File prefix<input id="pName" type="text" value="CurvedEnd" spellcheck="false"></label>
      </div>
      <div class="row" style="margin-top:8px"><button id="bZip" type="button">Download DXFs (.zip)</button><button id="bPdf" type="button">Shop drawings (PDF)</button></div>
      <div class="row" style="margin-top:6px"><button id="bJobSave" type="button">Save job file</button><label class="filebtn" for="fJob">Load job file</label><input id="fJob" type="file" accept=".json,application/json" hidden></div>
      <p class="val" id="zipMsg" style="margin:6px 0 0"></p>
    </div>
    <div>
      <h2>Explode</h2>
      <input id="explode" type="range" min="0" max="100" value="0" aria-label="Explode">
      <div class="row" style="margin-top:8px"><button id="bAsm">Assembled</button><button id="bExp">Exploded</button></div>
    </div>
    <div>
      <h2>Show</h2>
      <label><input id="cWrap" type="checkbox" checked><span class="swatch" style="background:var(--wrap)"></span>Face board</label>
      <label><input id="cXray" type="checkbox"> See-through face board</label>
      <label><input id="cXmel" type="checkbox"> See-through melamine</label>
      <label><input id="cTop" type="checkbox" checked> Top former</label>
      <label><input id="cFix" type="checkbox" checked> Fixing panel</label>
      <label><input id="cBack" type="checkbox" checked> Back</label>
      <label><input id="cHoles" type="checkbox" checked><span class="swatch" style="background:var(--accent)"></span>Ø5 fixing holes</label>
      <label><input id="cVan" type="checkbox" checked> Vanity (ghost)</label>
      <label><input id="cSpin" type="checkbox"> Auto-rotate</label>
    </div>
    <div>
      <h2>Views</h2>
      <div class="row"><button data-v="iso">3/4</button><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="top">Plan</button><button data-v="inside">Inside</button><button id="bHoles">Holes</button><button data-v="back">Back</button></div>
    </div>
    <div>
      <h2>Former · plan (rib cut-out in orange)</h2>
      <svg id="plan" viewBox="0 0 200 560" role="img" aria-label="Plan of the shaped former"></svg>
    </div>
    <div>
      <h2>Cut list · DXF part names</h2>
      <dl id="cut"></dl>
    </div>
    <div>
      <h2>Fixing holes · Ø5 through</h2>
      <dl id="holes"></dl>
    </div>
    <div>
      <h2>Face pocket · back of face board</h2>
      <dl id="kerf"></dl>
      <svg id="flat" viewBox="0 0 300 280" role="img" aria-label="Face board laid flat, back face up, with pocket"></svg>
    </div>
    <p class="note" id="rules"></p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
// ---------- rules (same as the DXF generator) ----------
const DEF={W:170,D:500,H:500,R:150,FT:18,SK:2,T:16.5,B:60,OS:0.3,OL:0,OR:0,OG:0,SBK:0,SBT:0,STP:0};
const BLOCK_WIDE=100, BLOCK_NARROW=60;
const POCK_EXT=3, OVER=8, HOLE_D=5, INSET=50, BACK_INSET=40, MAX_PITCH=250;
function spread(len,inset,maxP){const span=len-2*inset; if(span<=0) return [len/2];
  const n=Math.max(1,Math.ceil(span/maxP-1e-9)); return Array.from({length:n+1},(_,i)=>inset+span*i/n);}
// Geometry is described as closed loops in plan coords (x across, d = depth from front, front at d=0),
// each vertex [x, d, bulge]; bulge = tan(angle/4) of the arc to the next vertex, + = anticlockwise (d drawn upward).
const TB=Math.tan(Math.PI/8);
// Where the rib cut-out's rounded corner meets its rectangle (inset by the border).
function cornerArc(x0,x1,d0,d1,CX,CD,r){
  const cl=v=>Math.max(-1,Math.min(1,v));
  if(r<=0||x1<=CX) return null;
  const a=(x0-CX)/r; if(a>=1) return {cutFront:true};
  const tFront=Math.asin(cl((d0-CD)/r)), tLeft=a<=-1?-Infinity:-Math.acos(a);
  const ts=Math.max(tFront,tLeft), te=-Math.acos(cl((x1-CX)/r));
  if(te<=ts) return null;
  return {ts,te,b:Math.tan((te-ts)/4),onLeft:tLeft>tFront,
    ps:[CX+r*Math.cos(ts),CD+r*Math.sin(ts)], pe:[x1,CD+r*Math.sin(te)]};
}
// Rib cut-out: rib outline brought in by the border B (the rib, ignoring its small shoulders, is convex).
function ribCutout(p,c){
  const {W,D,FT,T,B}=p, r=c.RI-B;
  if(c.double){
    const x0=FT+B+(c.blkSide?T:0), x1=W-FT-B-(c.blkSide?T:0), d0=FT+B+(c.blkFront?T:0), d1=c.Dc-T-B, xm=W/2;
    if(x1-x0<30||d1-d0<30) return null;
    const k=cornerArc(xm,x1,d0,d1,c.CX,c.CD,r);
    if(!k) return [[x0,d0,0],[x1,d0,0],[x1,d1,0],[x0,d1,0]];
    if(k.cutFront) return null;
    const m=([x,d])=>[W-x,d], pe=k.pe, ps=k.ps, mpe=m(pe), mps=m(ps);
    const L=[[x0,d1,0],[mpe[0],mpe[1],k.b]];
    if(Math.abs(mps[0]-ps[0])>0.01) L.push([mps[0],mps[1],0]);
    L.push([ps[0],ps[1],k.b],[pe[0],pe[1],0],[x1,d1,0]);
    return L;
  }
  let x0=T+B, x1=W-FT-B-(c.blkSide?T:0), d0=FT+B+(c.blkFront?T:0), d1=c.Dc-T-B;
  if(x1-x0<30||d1-d0<30) return null;
  const rect=()=>[[x0,d0,0],[x1,d0,0],[x1,d1,0],[x0,d1,0]];
  const k=cornerArc(x0,x1,d0,d1,c.CX,c.CD,r);
  if(!k) return rect();
  if(k.cutFront){ d0=Math.max(d0,c.CD); return d1-d0<30?null:rect(); }
  const L=[]; if(!k.onLeft) L.push([x0,d0,0]);
  L.push([k.ps[0],k.ps[1],k.b],[k.pe[0],k.pe[1],0],[x1,d1,0],[x0,d1,0]);
  return L;
}
// hand: RH / LH = one curved end beside a vanity (fixing panel on the vanity side);
// DOUBLE = one cabinet, curve on both front corners, no fixing panel.
function calc(p){
  const {W,D,H,R,FT,SK,T}=p, c={...p}, E=POCK_EXT;
  // scribes: the face board keeps the full D x H; the carcass finishes short of the wall (Dc) and sits up off the floor (y0)
  const SBK=p.SBK||0, SBT=p.SBT||0, STP=p.STP||0, Dc=D-SBK, Hc=H-SBT-STP; c.Dc=Dc; c.Hc=Hc; c.y0=SBT;   // top scribe: carcass also stops STP below the top of the face board
  c.double=p.hand==='DOUBLE';
  c.CX=W-R; c.CD=R; c.RI=R-SK;
  c.maxGap=SK<=2?170:250;
  let g=1; while((Hc-(g+1)*T)/g>=c.maxGap && g<60) g++;
  c.gaps=g; c.pitch=(Hc-T)/g; c.clear=(Hc-(g+1)*T)/g;
  c.levels=Array.from({length:g+1},(_,i)=>i*c.pitch);
  c.holeY=c.levels.map(y=>y+T/2);
  c.arc=Math.PI/2*R;
  const RI=c.RI, CX=c.CX;
  if(c.double){
    const side=D-R, flat=W-2*R;
    // face board runs from the left wall end (X0) to the right wall end, plus the back overhangs to trim after glue-up
    const OL=p.OL||0, OR=p.OR||0; c.ovL=OL; c.ovR=OR;
    c.wrapLen=OL+2*side+2*c.arc+flat+OR;
    c.pockets=[[OL+side-E,OL+side+c.arc+E],[OL+side+c.arc+flat-E,OL+side+2*c.arc+flat+E]];
    if(c.pockets[0][1]>=c.pockets[1][0]) c.pockets=[[c.pockets[0][0],c.pockets[1][1]]];
    c.fixDepth=0; c.backX0=FT; c.backW=W-2*FT; c.formerX0=SK; c.formerW=W-2*SK; c.formerD=Dc-T-SK;
    c.fixToFormerX=[]; c.fixToBackY=[];
    // a full half-round front (width = 2 x radius) has no flat, so no front shoulders
    c.formerLoop=flat>0.01
      ? [[FT,Dc-T,0],[FT,R,0],[SK,R,TB],[R,SK,0],[R,FT,0],[W-R,FT,0],[W-R,SK,TB],[W-SK,R,0],[W-FT,R,0],[W-FT,Dc-T,0]]
      : [[FT,Dc-T,0],[FT,R,0],[SK,R,TB],[R,SK,TB],[W-SK,R,0],[W-FT,R,0],[W-FT,Dc-T,0]];
    c.wrapLoop=[[0,D+OL,0],[0,R,TB],[R,0,0],[W-R,0,TB],[W,R,0],[W,D+OR,0],[W-FT,D+OR,0],[W-FT,R+E,0],[W-SK,R+E,0],[W-SK,R,-TB],
      ...(flat>=2*E?[[W-R,SK,0],[W-R-E,SK,0],[W-R-E,FT,0],[R+E,FT,0],[R+E,SK,0],[R,SK,-TB]]:flat>0.01?[[W-R,SK,0],[R,SK,-TB]]:[[R,SK,-TB]]),[SK,R,0],[SK,R+E,0],[FT,R+E,0],[FT,D+OL,0]];
    c.pocketLines=flat>=2*E?[[R+E,FT],[W-R-E,FT],[FT,R+E],[W-FT,R+E]]:[[FT,R+E],[W-FT,R+E]];
  } else {
    // single end: X0 is the front end; only the wall end gets an overhang (right for RH, left for LH)
    // plus a gable overhang on the front (vanity-side) end, X0
    const OV=p.hand==='LH'?(p.OL||0):(p.OR||0), OG=p.OG||0; c.ovL=p.hand==='LH'?OV:0; c.ovR=p.hand==='LH'?0:OV; c.ovG=OG;
    c.wrapLen=OG+CX+c.arc+(D-R)+OV;
    c.pockets=[[OG+CX-E,OG+CX+c.arc+E]];
    c.fixDepth=Dc-FT; c.backX0=T; c.backW=W-FT-T; c.formerX0=T; c.formerW=W-SK-T; c.formerD=Dc-T-SK;
    c.fixToFormerX=spread(Dc-T-FT,INSET,MAX_PITCH);
    c.fixToBackX=Dc-T/2-FT; c.fixToBackY=spread(Hc,INSET,MAX_PITCH);
    c.formerLoop=[[T,FT,0],[CX,FT,0],[CX,SK,TB],[W-SK,R,0],[W-FT,R,0],[W-FT,Dc-T,0],[T,Dc-T,0]];
    c.wrapLoop=[[-OG,0,0],[CX,0,TB],[W,R,0],[W,D+OV,0],[W-FT,D+OV,0],[W-FT,R+E,0],[W-SK,R+E,0],[W-SK,R,-TB],[CX,SK,0],[CX-E,SK,0],[CX-E,FT,0],[-OG,FT,0]];
    c.pocketLines=[[CX-E,FT],[W-FT,R+E]];
  }
  c.backToFormerX=spread(c.backW,BACK_INSET,MAX_PITCH);
  // Fixing blocks: carcass-board strips, full carcass height, lying flat against the back of the face board's
  // full-thickness straights, checked into (notched through) the top, bottom and ribs. 100 wide if the straight
  // allows, otherwise 60. Side block sits hard against the back; front block hard against the fixing panel
  // (both-ends cabinet: a block on each side, and the front block centred).
  c.warn=[]; c.notes=[];   // notes are shown but don't block the export
  c.blocks=[]; c.blkSide=false; c.blkFront=false;
  const pickW=avail=>[BLOCK_WIDE,BLOCK_NARROW].find(v=>v<=avail+1e-9);
  if(p.blkS){ const wb=pickW((Dc-T)-(R+E));
    if(!wb) c.notes.push(`No room for a side fixing block: the flat side behind the curve is only ${f1(Math.max(0,(Dc-T)-(R+E)))} long (needs ${BLOCK_NARROW}).`);
    else { c.blkSide=true; const d0=Dc-T-wb, d1=Dc-T;
      c.blocks.push({name:c.double?'Block_SideR':'Block_Side',face:'side',dir:1,x0:W-FT-T,x1:W-FT,d0,d1,wb});
      const L=c.formerLoop, i=L.findIndex(v=>v[0]===W-FT&&v[1]===Dc-T);
      L.splice(i,1,[W-FT,d0,0],[W-FT-T,d0,0],[W-FT-T,d1,0]);
      if(c.double){ c.blocks.push({name:'Block_SideL',face:'side',dir:-1,x0:FT,x1:FT+T,d0,d1,wb});
        const j=L.findIndex(v=>v[0]===FT&&v[1]===Dc-T); L.splice(j,1,[FT+T,d1,0],[FT+T,d0,0],[FT,d0,0]); } } }
  if(p.blkF){ const avail=c.double?(W-R-E)-(R+E):(CX-E)-T, wb=pickW(avail);
    if(!wb) c.notes.push(`No room for a front fixing block: the flat front is only ${f1(Math.max(0,avail))} wide (needs ${BLOCK_NARROW}).`);
    else { c.blkFront=true; const L=c.formerLoop;
      if(c.double){ const a=W/2-wb/2, b=W/2+wb/2, i=L.findIndex(v=>v[0]===R&&v[1]===FT);
        c.blocks.push({name:'Block_Front',face:'front',dir:1,x0:a,x1:b,d0:FT,d1:FT+T,wb});
        L.splice(i+1,0,[a,FT,0],[a,FT+T,0],[b,FT+T,0],[b,FT,0]); }
      else { c.blocks.push({name:'Block_Front',face:'front',dir:1,x0:T,x1:T+wb,d0:FT,d1:FT+T,wb});
        const i=L.findIndex(v=>v[0]===T&&v[1]===FT); L.splice(i,1,[T,FT+T,0],[T+wb,FT+T,0],[T+wb,FT,0]); } } }
  c.blockHoleY=spread(Hc,INSET,MAX_PITCH);
  // each block: face holes up the centre (screw out into the face board) plus end holes on the top and bottom
  // formers' centrelines (screw back into their edges in the notch): 2 holes 25 in on a 100 block, 1 centred on a 60

  g(0,'TABLE');g(2,'LTYPE');g(70,1);g(0,'LTYPE');g(2,'CONTINUOUS');g(70,0);g(3,'Solid line');g(72,65);g(73,0);g(40,0);g(0,'ENDTAB');
  const all=['0',...layers];

  all.forEach(n=>{g(0,'LAYER');g(2,n);g(70,0);g(62,7);g(6,'CONTINUOUS');});
  g(0,'ENDTAB');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'BLOCKS');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
  ents.forEach(e=>{
    if(e.type==='circle'){ g(0,'CIRCLE');g(8,e.layer);g(10,r3(e.x));g(20,r3(e.y));g(30,0);g(40,e.r); }

function dxfParts(p){

  const lo=`OUTLINEZ${lnum(FT+OUTLINE_EXTRA)}L`, lp=`PKZ${lnum(FT-SK)}`;
  const lo16=`OUTLINEZ${lnum(T+OUTLINE_EXTRA)}L`, lb=`VBOREZ${lnum(T+THROUGH_EXTRA)}`;
  const rect=(L,H,layer)=>[{type:'poly',layer:'PART',pts:rectCCW(L,H)},{type:'poly',layer,pts:rectCW(L,H)}];
  const r2=v=>Math.round(v*100)/100;
  const circ=(x,y)=>({type:'circle',layer:lb,x:r2(x),y:r2(y),r:HOLE_D/2});

  const L=r2(c.wrapLen);

  }
  const bh=[]; c.holeY.forEach(y=>c.backToFormerX.forEach(x=>bh.push([x,y])));

    stroke(ACC,0.45); sv.rect(0,0,D+ovBack,H);
    if(ovBack){ stroke(DIMC,0.15,[0.8,0.8]); sv.poly([[D,0],[D,H]]); }
    stroke(INK,0.2,[1.2,0.8]); c.levels.forEach(y=>sv.rect(FT,c.y0+y,c.Dc-T-FT,T)); sv.rect(c.Dc-T,c.y0,T,c.Hc);
    sv.dimH(0,D,0,9); if(p.SBK) sv.dimH(c.Dc,D,0,17,`${n1(p.SBK)} scribe`);
    sv.dimV(c.y0,c.y0+c.Hc,D+ovBack,9,`${n1(c.Hc)} carcass`);
    if(c.gaps>1) sv.dimV(c.y0+c.levels[0]+T/2,c.y0+c.levels[1]+T/2,D+ovBack,18,`${n1(c.pitch)} c/c`);
    });
    // cut list
    const tx=a.x+a.w-tblW, ty=a.y+4; label('CUT LIST',tx,ty+4);
    const nR=c.gaps-1, rows=[['Part (DXF name)','Qty','Size','Board']];
    rows.push(['ext_FaceBoard','1',`${f2(c.wrapLen)} × ${n1(H)}`,n1(FT)]);
    if(!c.double) rows.push(['int_FixingPanel','1',`${n1(c.fixDepth)} × ${n1(c.Hc)}`,n1(T)]);
    rows.push(['int_Back','1',`${n1(c.backW)} × ${n1(c.Hc)}`,n1(T)]);
    rows.push(['int_Top','1',`${n1(c.formerW)} × ${n1(c.formerD)}`,n1(T)],['int_Bottom','1',`${n1(c.formerW)} × ${n1(c.formerD)}`,n1(T)]);
    c.blocks.forEach(k=>rows.push([`int_${k.name}`,'1',`${n1(k.wb)} × ${n1(c.Hc)}`,n1(T)]));
    if(nR) rows.push([nR>1?`int_Rib1–int_Rib${nR}`:'int_Rib1',String(nR),`${n1(c.formerW)} × ${n1(c.formerD)}`,n1(T)]);
    const cw=[40,12,46,20]; let yy=ty+10;
    rows.forEach((r,i)=>{ let xx=tx; r.forEach((cell,j)=>{ txt(cell,xx+1.5,yy+4,7,{bold:i===0}); xx+=cw[j]; });
      stroke(INK,i===0?0.3:0.1); doc.line(tx,yy+5.6,tx+tblW,yy+5.6); yy+=6.2; });
    yy+=6; label('NOTES',tx,yy); yy+=5;
    const notes=[`Face board: ${n1(FT)} mm, pocketed on the back to a ${n1(SK)} mm skin across each curve.`,
      `Carcass: ${n1(T)} mm white melamine.`,
      `Formers: top, bottom${nR?` and ${nR} rib${nR>1?'s':''}`:''} at ${n1(c.pitch)} c/c (clear gap ${n1(c.clear)}).`,
      c.cut?`Ribs have a centre cut-out leaving a ${n1(p.B)} border${p.OS?`, ${f2(p.OS)} onion skin`:''}.`:null,
      `Fixings: Ø${HOLE_D} through-holes, centred on the adjoining part.`,
      (ovBack||ovG)?`Overhangs (trim after glue-up): ${[ovG&&`${n1(ovG)} gable`,c.ovL&&`${n1(c.ovL)} back left`,c.ovR&&`${n1(c.ovR)} back right`].filter(Boolean).join(', ')}.`:null,
      (p.SBK||p.SBT||p.STP)?`Scribe allowance (left on for site): ${n1(p.SBK||0)} back, ${n1(p.SBT||0)} bottom, ${n1(p.STP||0)} top.`:null].filter(Boolean);
    notes.forEach(s=>{ const lines=doc.setFontSize(7).splitTextToSize('• '+s,tblW-2); lines.forEach(l=>{ txt(l,tx,yy,7); yy+=3.6; }); yy+=1; });
  }

  // ===== Sheet 2: face board =====
  { const a=sheet('Face board — flat, back face up');
    const L=c.wrapLen;
    const trims=[]; if(c.double){ if(c.ovL) trims.push(c.ovL); if(c.ovR) trims.push(L-c.ovR); } else { if(ovG) trims.push(ovG); const ob=c.ovL||c.ovR; if(ob) trims.push(L-ob); }
    fit({x:a.x,y:a.y,w:a.w,h:a.h-30},sc=>{ const v=view(a.x+25,a.y+30+(H+OVER)/sc,sc);
    label('FACE BOARD',a.x+25,a.y+8,`Scale 1:${sc} · ${n1(FT)} mm board · viewed from the back face · ${c.double?'left wall end':'front (gable) end'} at left`);
    c.pockets.forEach(([s,e])=>{ doc.setFillColor(250,226,205); v.rect(s,-OVER,e-s,H+2*OVER,'F'); stroke(ACC,0.3,[1.5,1]); v.rect(s,-OVER,e-s,H+2*OVER); });
    stroke(INK,0.45); v.rect(0,0,L,H);
    stroke(DIMC,0.15,[0.8,0.8]); trims.forEach(x=>v.poly([[x,0],[x,H]]));
    const pts=[0]; c.pockets.forEach(([s,e])=>pts.push(s,e)); pts.push(L);
    for(let i=0;i<pts.length-1;i++) v.dimH(pts[i],pts[i+1],-OVER,9,f2(pts[i+1]-pts[i]));
    v.dimH(0,L,-OVER,18,f2(L)); v.dimV(0,H,L,9); v.dimV(-OVER,H+OVER,c.pockets[0][0],-8,n1(H+2*OVER));
    c.pockets.forEach(([s,e],i)=>txt(`POCKET${c.pockets.length>1?' '+(i+1):''}`,v.X((s+e)/2),v.Y(H/2),7,{align:'center',col:ACC,bold:true}));
    });
    let yy=a.y+a.h-22; label('NOTES',a.x,yy); yy+=5;
    [`Pocket depth ${n1(FT-SK)} from the back face, leaving a ${n1(SK)} mm skin. Pocket runs ${POCK_EXT} mm past each end of the curve.`,
     `Pocket overruns the top and bottom edges by ${OVER} mm (${n1(H+2*OVER)} overall) so the cutter clears the board.`,
     trims.length?'Dashed lines mark the overhang to trim off after glue-up.':null,
     `DXF layers: PKZ${lnum(FT-SK)} (pocket), OUTLINEZ${lnum(FT)}L (outline).`].filter(Boolean).forEach(s=>{ txt('• '+s,a.x,yy,7); yy+=4; });
  }

  // ===== Sheet 3 (and 3b): drilled panels =====
  const drillSheet=(title,panels,note)=>{ const a=sheet(title);
    const th=Math.max(...panels.map(q=>q.h));
    const subOf=(q,sc)=>`Scale 1:${sc} · ${n1(q.w)} × ${n1(q.h)} × ${n1(T)} · ${q.holes.length} × Ø${HOLE_D} through · ${q.sub}`;
    fit({x:a.x,y:a.y,w:a.w,h:a.h-10},sc=>{ let x0=a.x+35;
    panels.forEach(q=>{ const v=view(x0,a.y+24+th/sc,sc);
      label(q.name,x0,a.y+8,subOf(q,sc));
      stroke(INK,0.45); v.rect(0,0,q.w,q.h);
      stroke(DIMC,0.1,[0.6,0.8]); c.holeY.forEach(y=>v.poly([[0,y],[q.w,y]]));
      stroke(ACC,0.3); q.holes.forEach(([x,y])=>{ v.circle(x,y,HOLE_D/2); const px=v.X(x), py=v.Y(y); doc.line(px-1.6,py,px+1.6,py); doc.line(px,py-1.6,px,py+1.6); });
      const xs=[0,...q.xs.slice().sort((a,b)=>a-b),q.w]; for(let i=0;i<xs.length-1;i++) if(xs[i+1]-xs[i]>0.01) v.dimH(xs[i],xs[i+1],0,8,n1(xs[i+1]-xs[i]));
      v.dimH(0,q.w,0,16,n1(q.w));
      const ys=[0,...q.ys,q.h]; for(let i=0;i<ys.length-1;i++) if(ys[i+1]-ys[i]>0.01) v.dimV(ys[i],ys[i+1],0,-8,n1(ys[i+1]-ys[i]));
      v.dimV(0,q.h,0,-17,n1(q.h));
      if(q.ysR){ const yr=[0,...q.ysR,q.h]; for(let i=0;i<yr.length-1;i++) if(yr[i+1]-yr[i]>0.01) v.dimV(yr[i],yr[i+1],q.w,8,n1(yr[i+1]-yr[i])); }
      doc.setFontSize(6); x0+=Math.max(q.w/sc+(q.ysR?20:8), doc.getTextWidth(subOf(q,sc)))+38; });
    });
    txt('• '+note,a.x,a.y+a.h-2,7); };
  { const panels=[];
    if(!c.double){ const h=[]; c.holeY.forEach(y=>c.fixToFormerX.forEach(x=>h.push([x,y]))); c.fixToBackY.forEach(y=>h.push([c.fixToBackX,y]));
      panels.push({name:'FIXING PANEL',sub:'front edge at left',w:c.fixDepth,h:c.Hc,holes:h,xs:[...c.fixToFormerX,c.fixToBackX],ys:c.holeY,ysR:c.fixToBackY}); }
    const h=[]; c.holeY.forEach(y=>c.backToFormerX.forEach(x=>h.push([x,y])));
    panels.push({name:'BACK',sub:c.double?'left edge at left':'vanity-side edge at left',w:c.backW,h:c.Hc,holes:h,xs:c.backToFormerX,ys:c.holeY});
    drillSheet(c.double?'Back — drilling':'Fixing panel and back — drilling',panels,
      `Holes are centred on the thickness of the part they screw into (dotted lines = former centrelines). DXF layer VBOREZ${lnum(T+THROUGH_EXTRA)}.`); }
  if(c.blocks.length) drillSheet('Fixing blocks — drilling',
    c.blocks.map(k=>({name:'int_'+k.name,sub:k.name.includes('Front')?'flat front':'flat side, hard to the back',w:k.wb,h:c.Hc,holes:k.holes,xs:k.holeX,ys:k.holeYs})),
    `Blocks run the full carcass height and are checked into the top, bottom and ribs, lying flat against the back of the face board. Screw out through the centre Ø${HOLE_D} holes into the face board, and back through the holes on each former line into the top, bottom and ribs.`);

  // ===== Sheet 4: formers =====
  { const a=sheet('Top, bottom and ribs');
    const fw=c.formerW, fd=c.formerD, two=!!c.cut, gap=50;
    const tx=L=>{ let q=L.map(([x,d,b])=>[x-c.formerX0,d-SK,b]); if(lh) q=mirLoop(q,fw); return flatLoop(q); };  // true top view, front at bottom
    const drawFormer=(sc,x0,name,withCut)=>{ const v=view(x0,a.y+26+fd/sc,sc);
      label(name,x0,a.y+8,`Scale 1:${sc} · ${n1(fw)} × ${n1(fd)} × ${n1(T)} · top view, front at bottom`);
      stroke(INK,0.45); v.poly(tx(c.formerLoop),true);
      if(withCut){ stroke(ACC,0.35); v.poly(tx(c.cut),true); const q=tx(c.cut), ymax=Math.max(...q.map(k=>k[1])), xmid=(Math.min(...q.map(k=>k[0]))+Math.max(...q.map(k=>k[0])))/2;
        v.dimV(ymax,fd,xmid,0,`${n1(p.B)} border`); txt('CUT-OUT',v.X(xmid),v.Y(ymax)+8,7,{align:'center',col:ACC,bold:true}); }
      v.dimH(0,fw,0,9,n1(fw)); v.dimV(0,fd,lh?0:fw,lh?-9:9,n1(fd));
      const cxm=(lh?fw-(c.CX-c.formerX0):c.CX-c.formerX0), cym=c.CD-SK, rr=c.RI*0.7071, sgn=lh?-1:1;
      stroke(DIMC,0.12); doc.line(v.X(cxm),v.Y(cym),v.X(cxm+sgn*rr),v.Y(cym-rr)); txt(`R${n1(c.RI)}`,v.X(cxm+sgn*rr*0.5)-sgn*4,v.Y(cym-rr*0.5)-1,7,{col:DIMC,align:'center'});
      if(c.double){ const cx2=R-SK; doc.line(v.X(cx2),v.Y(cym),v.X(cx2-rr),v.Y(cym-rr)); txt(`R${n1(c.RI)}`,v.X(cx2-rr*0.5)+4,v.Y(cym-rr*0.5)-1,7,{col:DIMC,align:'center'}); }
      return x0+Math.max(fw/sc,95); };
    const nR=c.gaps-1;
    fit({x:a.x,y:a.y,w:a.w,h:a.h-16},sc=>{ const nx=drawFormer(sc,a.x+30,'TOP / BOTTOM (2 off)',false);
      if(two) drawFormer(sc,nx+gap,`RIB (${nR} off)`,true); });
    let yy=a.y+a.h-10;
    [`Corner radius R${n1(c.RI)} = outside radius less the ${n1(SK)} mm skin. Shoulders step from the skin back to the full ${n1(FT)} mm board.`,
     two?`Rib cut-out leaves a ${n1(p.B)} mm border all round${p.OS?`; routed ${n1(T-p.OS)} deep to leave a ${f2(p.OS)} onion skin`:''}. Top and bottom are solid.`:(nR?`Ribs (${nR} off) are the same shape as the top and bottom.`:null)].filter(Boolean)
      .forEach(s=>{ txt('• '+s,a.x,yy,7); yy+=4; });
  }
  // sheet numbers
  const N=sheets.length; doc.__sheetPos.forEach(([x,y],i)=>{ doc.setPage(i+1); txt(`${i+1} / ${N}`,x,y,10,{bold:true}); });
  return doc;
}
window.__shopDrawings=shopDrawings;

// ---------- export ----------
// Inside Claude, saves go through Claude's save prompt. Opened as a plain .html file (no Claude runtime),
// the page falls back to an ordinary browser download so the buttons still work.
const standalone=!window.claude;
const browserSave={ async save({filename,data}){ const blob=data instanceof Blob?data:new Blob([data]);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); return {status:'saved'}; } };
let downloads=standalone?browserSave:null;
(async()=>{ if(standalone) return; try{ downloads=await window.claude?.use?.('downloads'); }catch(e){ downloads=null; }
  if(!downloads){ $('bZip').disabled=true; $('bPdf').disabled=true; $('bJobSave').disabled=true; $('zipMsg').textContent='Downloads aren’t available in this view. Ask Claude for the files instead.'; } })();
$('bZip').onclick=async()=>{
  const p=readParams(), tag=p.hand==='DOUBLE'?'2E':p.hand;
  const sets=[{h:tag,...dxfParts(p)}], c=sets[0].c;
  const pre=(($('pName').value||'CurvedEnd').trim().replace(/[^A-Za-z0-9_-]+/g,'_'))||'CurvedEnd';
  if(c.warn.length){ $('zipMsg').textContent='Fix the size warning first.'; return; }
  if(!downloads||typeof JSZip==='undefined'){ $('zipMsg').textContent='Downloads aren’t available in this view.'; return; }
  const zip=new JSZip(); let nFiles=0; sets.forEach(({h,files})=>Object.entries(files).forEach(([nm,txt])=>{ zip.file(`${partName(nm)}.dxf`,txt); nFiles++; }));
  zip.file(`${pre}_job.json`,JSON.stringify(jobFile(),null,2));   // record of the settings these DXFs were cut from
  const blob=await zip.generateAsync({type:'blob'});
  const fname=`${pre}_${tag}_${f1(p.W)}x${f1(p.D)}x${f1(p.H)}_R${f1(p.R)}.zip`;
  $('bZip').disabled=true; $('zipMsg').textContent=standalone?'Saving…':'Waiting for you to confirm the save…';
  try{ await downloads.save({filename:fname,data:blob}); $('zipMsg').textContent=`Saved ${fname} · ${nFiles} DXFs + job file`; }
  catch(e){ $('zipMsg').textContent= e&&e.code==='declined'?'Save cancelled.':e&&e.code==='rate_limited'?'A save prompt is already open.':'Couldn’t save: '+(e&&e.message||'unknown error'); }
  finally{ $('bZip').disabled=false; }
};

$('bJobSave').onclick=async()=>{
  const p=readParams(), tag=p.hand==='DOUBLE'?'2E':p.hand;
  const pre=(($('pName').value||'CurvedEnd').trim().replace(/[^A-Za-z0-9_-]+/g,'_'))||'CurvedEnd';
  if(!downloads){ $('zipMsg').textContent='Downloads aren’t available in this view.'; return; }
  const fname=`${pre}_${tag}_${f1(p.W)}x${f1(p.D)}x${f1(p.H)}_R${f1(p.R)}_job.json`;
  $('bJobSave').disabled=true; $('zipMsg').textContent=standalone?'Saving…':'Waiting for you to confirm the save…';
  try{ await downloads.save({filename:fname,data:JSON.stringify(jobFile(),null,2)}); $('zipMsg').textContent=`Saved ${fname}`; }
  catch(e){ $('zipMsg').textContent= e&&e.code==='declined'?'Save cancelled.':e&&e.code==='rate_limited'?'A save prompt is already open.':'Couldn’t save the job file: '+(e&&e.message||'unknown error'); }
  finally{ $('bJobSave').disabled=false; }
};
$('fJob').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ $('zipMsg').textContent=loadJob(String(r.result)); e.target.value=''; };
  r.onerror=()=>{ $('zipMsg').textContent='Couldn’t read that file.'; e.target.value=''; };
  r.readAsText(f);
});

$('bPdf').onclick=async()=>{
  const p=readParams(), c=calc(p), tag=p.hand==='DOUBLE'?'2E':p.hand;
  const pre=(($('pName').value||'CurvedEnd').trim().replace(/[^A-Za-z0-9_-]+/g,'_'))||'CurvedEnd';
  if(c.warn.length){ $('zipMsg').textContent='Fix the size warning first.'; return; }
  if(!downloads||!window.jspdf){ $('zipMsg').textContent='Downloads aren’t available in this view.'; return; }
  const fname=`${pre}_${tag}_${f1(p.W)}x${f1(p.D)}x${f1(p.H)}_R${f1(p.R)}_ShopDrawings.pdf`;
  $('bPdf').disabled=true; $('zipMsg').textContent=standalone?'Saving…':'Waiting for you to confirm the save…';
  try{ const doc=shopDrawings(p,pre); await downloads.save({filename:fname,data:doc.output('arraybuffer')}); $('zipMsg').textContent=`Saved ${fname}`; }
  catch(e){ $('zipMsg').textContent= e&&e.code==='declined'?'Save cancelled.':e&&e.code==='rate_limited'?'A save prompt is already open.':'Couldn’t make the drawings: '+(e&&e.message||'unknown error'); }
  finally{ $('bPdf').disabled=false; }
};

function resize(){const w=host.clientWidth,h=host.clientHeight||500;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host); resize();

loadSettings();
build(readParams());
camera.position.set(...views.iso); controls.target.copy(views.ctr);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){
  if(camTo){const k=Math.min(1,(now-t0)/(reduce?1:700));const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camFrom,camTo,e); controls.target.lerpVectors(tgtFrom,tgtTo,e); if(k>=1)camTo=null;}
  ex+=(exT-ex)*(reduce?1:.12);
  parts.forEach(p=>p.obj.position.copy(p.base).addScaledVector(p.dir,ex));
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
